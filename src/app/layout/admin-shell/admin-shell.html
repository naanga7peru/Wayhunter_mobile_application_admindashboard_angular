<div class="admin-shell">
  <a class="skip-link" href="#admin-content" (click)="skipToContent($event, content)">Skip to content</a>
  <header class="topbar">
    <button #mobileToggle type="button" class="mobile-toggle" aria-controls="admin-drawer"
            aria-haspopup="dialog" [attr.aria-expanded]="drawerOpen()" (click)="openDrawer()">
      <svg width="18" height="14" viewBox="0 0 18 14" aria-hidden="true">
        <path d="M0 1h18M0 7h18M0 13h18" stroke="currentColor" stroke-width="2" />
      </svg>
      Open navigation
    </button>
    <strong>Admin workspace</strong>
    @if (preview) {
      <span class="preview-label">Development preview</span>
    }
  </header>

  <aside class="sidebar" aria-label="Admin sidebar">
    <ng-container *ngTemplateOutlet="navigation; context: { prefix: 'rail' }" />
  </aside>

  <dialog #drawer class="drawer" id="admin-drawer" aria-label="Admin navigation"
          (cancel)="closeDrawer($event)" (close)="restoreDrawerFocus()">
    <button type="button" class="close-drawer" autofocus (click)="closeDrawer()">Close navigation</button>
    <ng-container *ngTemplateOutlet="navigation; context: { prefix: 'drawer' }" />
  </dialog>

  <main #content id="admin-content" class="main-area" tabindex="-1">
    <div class="page-content">
      <h1 class="page-title" [class.visually-hidden]="title() === 'Dashboard'">{{ title() }}</h1>
      <router-outlet />
    </div>
  </main>
</div>

<ng-template #navigation let-prefix="prefix">
  <div class="brand">
    <svg class="rail-brand" width="36" height="36" viewBox="0 0 100 100" aria-hidden="true">
      <path fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"
            stroke-linejoin="round" d="m19 69 19-29 12 16 14-27 20 40H19m38-26 7 6 7-6" />
    </svg>
    WayHunter
  </div>
  <nav aria-label="Admin navigation groups">
    <ul class="groups">
      @for (group of groups; track group.label; let index = $index) {
        <li>
          <button #trigger type="button" class="group-button" [class.current]="activeGroup() === group"
                  [attr.aria-controls]="prefix + '-modules-' + index"
                  [attr.aria-expanded]="openGroup() === group" (click)="toggleGroup(group)">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path [attr.d]="group.icon" />
            </svg>
            <span>{{ group.label }}</span>
            <svg class="chevron" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
          </button>
          <ul class="module-list" [id]="prefix + '-modules-' + index" [hidden]="openGroup() !== group"
              (keydown.escape)="dismissGroup($event, group, trigger)">
            @for (link of group.links; track link.path) {
              <li>
                <a class="nav-link" [routerLink]="link.path" routerLinkActive="active"
                   [routerLinkActiveOptions]="activeLinkOptions" ariaCurrentWhenActive="page">{{ link.label }}</a>
              </li>
            }
          </ul>
        </li>
      }
    </ul>
  </nav>
</ng-template>
